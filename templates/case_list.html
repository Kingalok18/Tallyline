{% extends "base.html" %}
{% block title %}Cases · Tallyline{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Cases</h1>
  <div class="head-actions">
    <a class="button" href="/cases/new">Add case</a>
  </div>
</div>
<form class="filters" hx-get="/" hx-target="#case-rows" hx-swap="innerHTML"
      hx-trigger="input changed delay:200ms from:#search, change">
  <input id="search" type="search" name="q" value="{{ q }}" placeholder="Search by case ID, provider, issue or status" aria-label="Search cases">
  <select name="case_type" aria-label="Insurance type">
    <option value="">All insurance types</option>
    {% for name, type in case_types.items() %}
    <option value="{{ name }}" {% if selected_type == name %}selected{% endif %}>{{ type.label }}</option>
    {% endfor %}
  </select>
  <select name="risk" aria-label="Risk">
    <option value="">All risk levels</option>
    {% for level in ['High', 'Medium', 'Low', 'Not analysed'] %}
    <option value="{{ level }}" {% if selected_risk == level %}selected{% endif %}>{{ level }}</option>
    {% endfor %}
  </select>
</form>
<div class="panel table-wrap">
  <table class="case-table">
    <thead>
      <tr><th>Case</th><th>Insurance type</th><th>Incident date</th><th class="num">Amount</th><th>Risk</th><th>Main issue</th><th>Status</th></tr>
    </thead>
    <tbody id="case-rows">
      {% include "_case_rows.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
