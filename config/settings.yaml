# Tallyline settings. Answers from the setup questions are noted beside each key.
llm_model: qwen2.5:3b-instruct      # Q3: 3B
ollama_url: http://localhost:11434
embedding_model: BAAI/bge-small-en-v1.5
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
use_reranker: true
chunk_size: 300
chunk_overlap: 30
top_k: 10
top_n_after_rerank: 4
min_score: 0.2                      # below this, answer "Not found in the documents."
rerank_temperature: 5.0             # scales raw reranker values to 0-1 before min_score applies
red_flag_min_score: 0.4             # a sentence must match a warning sign at least this well to raise it
seed: 42
open_cases: 50                      # Q4: reduced from 200 to fit CPU-only model speed
past_cases: 200                     # Q4: reduced from 800
mismatch_rate_fraud: 0.6
mismatch_rate_genuine: 0.3          # user decision: raised from 0.1 so 50 cases get enough planted mismatches
case_types: [vehicle, health, property]  
case_type_shares: {vehicle: 15, health: 18, property: 17}  
theme: system                      

# How the free text in case documents is written: llm or template.
document_writer: llm

# Sample data shape
lookalike_share: 0.15               # share of open cases with a planted look-alike past case
coverage_rate_excluded: 0.15
coverage_rate_partly: 0.10

# General checks 
early_incident_days: 30
invoice_over_estimate_ratio: 1.3
provider_repeat_threshold: 5
provider_recent_days: 90

# Risk score. Weights are shown in the UI and always add up to 1.
risk_weights:
  model: 0.35
  mismatches: 0.30
  red_flags: 0.20
  past_cases: 0.15
risk_mismatches_full: 3             # this many mismatches gives the full mismatch weight
risk_red_flags_full: 5              # this many warning signs gives the full warning-sign weight
risk_level_medium: 34               # score at or above this is Medium
risk_level_high: 67                 # score at or above this is High

# Language model call limits
llm_num_ctx: 4096
llm_timeout_seconds: 600
